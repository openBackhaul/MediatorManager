validation-sequence:
  type: array
  x-key: _trigger-function
  description: >
    'List of the definitions of validation sequences
    The defined sequences are input to the generic ValidationOrchestrator Function
    ValidationOrchestrator is responding 204, if all Functions in the sequence responded 204, or any other response code that resulted during executing the sequence'
  items:
    type: object
    required:
      - _trigger-function
      - sequence
    properties:
      _trigger-function:
        type: string
        description: >
          'Reference towards an entry in the list of Functions (value must be unique and invariant)
          Only Functions for changing the contents of the CandidateDS are allowed to be referenced'
        example: 'v1-establish-management-plane-transport'
      sequence:
        type: array
        x-key: step-number
        description: 'Sequence of validation test Functions that shall be executed on the contents of the CandidateDS'
        items:
          type: object
          required:
            - step-number
            - _validation-function
          properties:
            step-number:
              type: integer
              description: 'Sequential number of the validation test (value must be unique and invariant)'
            _validation-function:
              type: string
              description: >
                'Reference towards an entry in the list of Functions
                Only Functions for executing a validation test on the contents of the CandidateDS are allowed to be referenced'
example:

# See the following entries as examples
# Exact validations sequences are to be defined by ApplicationOwner
# (Please, delete this comment after reading)

  - _trigger-function: 'v1-create-controller-template'
    sequence:
      - step-number: 0
        _validation-function: 'p1-ensure-unique-template-names'
  - _trigger-function: 'v1-delete-controller-template'
    sequence:
      - step-number: 0
        _validation-function: 'p1-ensure-all-elements-referencing-an-existing-template'
      - step-number: 1
        _validation-function: 'p1-ensure-existing-template-is-not-in-service'
  - _trigger-function: 'v1-update-controller-template'
    sequence:
      - step-number: 0
        _validation-function: 'p1-ensure-all-elements-referencing-an-existing-template'
      - step-number: 1
        _validation-function: 'p1-ensure-all-existing-controllers-complying-with-updated-template-definition'
        [[Prathiba] : shall be deleted. refer mediator-vm-template comment]
  - _trigger-function: 'v1-create-mediator-vm-template'
    sequence:
      - step-number: 0
        _validation-function: 'p1-ensure-unique-template-names'
      - step-number: 1
        _validation-function:
  - _trigger-function: 'v1-delete-mediator-vm-template'
    sequence:
      - step-number: 0
        _validation-function: 'p1-ensure-all-elements-referencing-an-existing-template'
      - step-number: 1
        _validation-function: 'p1-ensure-existing-template-is-not-in-service'
  - _trigger-function: 'v1-update-mediator-vm-template'
    sequence:
      - step-number: 0
        _validation-function: 'p1-ensure-all-elements-referencing-an-existing-template'
      - step-number: 1
        _validation-function: 'p1-ensure-all-existing-mediator-vms-complying-with-updated-template-definition'
        [[Prathiba] : 
        PROPOSAL : This function shall be removed from here.
        REASON : Templates dont have to comply with the mediatorVms. MediatorVms should comply with the template.
        As per the issue https://github.com/openBackhaul/MediatorManager/issues/26 , we decided to tune the mediatorVM as per the mediator-vm-template’s engineering-limit. 
        Means, if engineering-limit is lowered for example from 1000 to 500, then all the paired mediatorVM needs to reduce their mediator process count to 500. 
        So, in the validation module, if we wait for the all the mediatorVMs to comply with the new change, then we cannot able to respond to the requestor within a reasonable timeframe.
        ---------------
        SUGGESTION : 
        Datastores >
          RunningDS  : updated template shall be copied to RunningDS without any validation(ofcourse if the template exist). 
          OperationDS: value of the engineering-limit shall be updated once all the mediatorVms are compliant.
        Functions >
          Monitoring : creates an alarm for the mismatch in the element
          Implementation : Action that needs to resolve the mismatch. For example , deleting nodes when engineering limit are lowered. 
          QUERY : we also have to think about how other attributes like operation-names will be modified if those are modified in the template?
          Measurement : For engineering-limit , number of mediatorProcess shall be measured. If all mediator VMs are complied, then the template value shall be updated.
        ]
