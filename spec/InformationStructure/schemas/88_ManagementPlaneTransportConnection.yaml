forwarding-construct:
  type: array
  x-key: mount-name
  items:
    type: object
    required:
      - mount-name
      - fctp
      - route
    properties:
      mount-name:
        type: string
        description: >
          'MountName
          candidate: from [DDM://v1/establish-management-plane-transport$request.body#device-name]
          running: from candidate
          operational: from [module OperationalManagementPlaneTransportList]'
      fctp:
        type: array
        x-key: _cc
        minItems: 2
        maxItems: 2
        items:
          oneOf:
            - description: managementPlaneTransportClient
              type: object
              required:
                - _cc
              properties:
                _cc:
                  type: string
                  description: >
                    'ControllerName
                    candidate: from [DDM://v1/establish-management-plane-transport$request.body#controller-name]
                    running: from candidate
                    operational: from ???
            - description: managementPlaneTransportServer
              type: object
              required:
                - _cc
              properties:
                _cc:
                  type: string
                  description: >
                    'MountName of Device
                    candidate: from [DDM://v1/establish-management-plane-transport$request.body#device-name]
                    running: from candidate
                    operational: from [MWDI://core-model-1-4:network-control-domain=cache/control-construct={MountName}?fields=control-construct-pac(external-label)]
      route:
        type: array
        x-key: local-id
        items:
          type: object
          required:
            - local-id
            - _link
          properties:
            local-id:
              type: string
              description: >
                'Identifier that is unique within the list of Routes
                candidate: created while/after module ??? created a new mediatorProcess
                running: from candidate
                operational: from ???
            _links:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: string
                description: >
                  'Pair of the two localIds of the netconfLink and the snmpLink on the transport path of the managementPlaneTransport
                  netconfLink:
                    candidate: from ???
                    running: from ???
                    operational: from ???
                  snmpLink:
                    candidate: from ???
                    running: from ???
                    operational: from ???'
