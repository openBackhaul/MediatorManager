forwarding-construct:
  type: array
  x-key: forwarding-construct-name
  items:
    type: object
    required:
      - forwarding-construct-name
      - fctp
      - route
    properties:
      forwarding-construct-name:
        type: string
        description: >
          'deviceName
          candidate: from [DDM://v1/establish-management-plane-transport$request.body#device-name]
          running: from candidate
          operational: from [module OperationalManagementPlaneTransportList]'
      fctp:
        type: array
        x-key: fctp-type
        minItems: 2
        maxItems: 2
        items:
          oneOf:
            - description: managementPlaneTransportClient
              type: object
              required:
                - fctp-type
                - _cc
              properties:
                fctp-type:
                  type: string
                  enum:
                    - 'management-plane-transport-client'
                _cc:
                  type: string
                  description: >
                    'controllerName
                    candidate: from [DDM://v1/establish-management-plane-transport$request.body#controller-name]
                    running: from candidate
                    operational: from running'
            - description: managementPlaneTransportServer
              type: object
              required:
                - fctp-type
                - _cc
              properties:
                fctp-type:
                  type: string
                  enum:
                    - 'management-plane-transport-server'
                _cc:
                  type: string
                  description: >
                    'deviceName
                    candidate: from [DDM://v1/establish-management-plane-transport$request.body#device-name]
                    running: from candidate
                    operational: from running'
      route:
        type: array
        x-key: local-id
        items:
          type: object
          required:
            - local-id
            - _links
          properties:
            local-id:
              type: string
              description: >
                'Identifier that is unique within the list of Routes
                candidate:
                running: from candidate
                operational: from running; entire Route to be deleted, if one of the referenced Links does not exist in operationalDS'
            _links:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: string
                description: >
                  'Pair of the two localIds of the netconfLink and the snmpLink on the transport path of the managementPlaneTransport
                  netconfLink:
                    candidate: from [DDM://v1/establish-management-plane-transport interpreting the incoming request, creating a netconfLink in CandidateDS and inventing a local-id for that Link object]
                    running: from candidate
                    operational: from running'
                  snmpLink:
                    candidate: from [DDM://v1/establish-management-plane-transport interpreting the incoming request, creating an snmpLink in CandidateDS and inventing a local-id for that Link object]
                    running: from candidate
                    operational: from running'
