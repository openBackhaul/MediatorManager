profile:
  type: array
  x-key: template-name
  items:
    oneOf:
      - description: 'controllerTemplate'
        type: object
        required:
          - template-name
          - category
        properties:
          template-name:
            type: string
            description: >
              'controllerTemplateName
              candidate: from [DDM://v1/create-controller-template$request.body#controller-template-name]
              running: from candidate
              operational: ./. - does not exist in OperationalDS as it cannot be measured'
          category:
            type: string
            enum:
              - 'controller'

          # Please add, remove and change the parameters that need to be managed by template here
