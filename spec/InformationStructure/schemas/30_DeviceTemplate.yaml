profile:
  type: array
  x-key: template-name
  items:
    oneOf:
      - description: 'deviceTemplate'
        type: object
        required:
          - template-name
          - category
          - default-mediator-user
        properties:
          template-name:
            type: string
            description: >
              'deviceTemplateName needs to cover all values potentially send in [DDM://v1/establish-management-plane-transport$request.body#device-kind-name]
              candidate: from [DDM://v1/create-device-template$request.body#device-template-name]
              running: from candidate
              operational: ./. - does not exist in OperationalDS as it cannot be measured'
          category:
            type: string
            enum:
              - 'device'

          # Please add, remove and change the parameters that need to be managed by template here

