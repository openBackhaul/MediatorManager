control-construct:
  type: array
  x-key: element-name
  items:
    oneOf:
      - description: 'controller'
        type: object
        required:
          - element-name
          - category
          - _template
          - logical-termination-point
        properties:
          element-name:
            type: string
            description: >
              'controllerName
              candidate: from [DDM://v1/regard-controller$request.body#controller-name]
              running: from candidate
              operational: from running; entire CC to be deleted, if applicationName not included in [[CDM://v1/provide-list-of-controllers/controller-name]$response.body#list-of-controller-names]'
          category:
            type: string
            enum:
              - 'controller'
          _template:
            type: string
            description: >
              'controllerTemplateName
              Reference towards an entry in the list of Profiles
              Both instances of ControlConstruct and Profile must have an identical value in their category attributes
              candidate: from [DDM://v1/regard-controller$request.body#controller-template-name]
              running: from candidate
              operational: ./. - does not exist in OperationalDS as it cannot be read from the real element'
          logical-termination-point:
            type: array
            x-key: mount-name
            items:
              oneOf:
                - description: 'LogicalTerminationPoint - see 12_MountPoint.yaml'
                  type: object
