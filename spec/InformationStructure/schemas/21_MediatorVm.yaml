control-construct:
  type: array
  x-key: element-name
  items:
    oneOf:
      - description: 'mediatorVm'
        type: object
        required:
          - element-name
          - category
          - _template
          - default-snmp-user-name
          - default-snmp-user-password
          - default-netconf-user-name
          - default-netconf-user-password
          - logical-termination-point
        properties:
          element-name:
            type: string
            description: >
              'mediatorVmName
              candidate: from [DDM://v1/regard-mediator-vm$request.body#mediator-vm-name]
              running: from candidate
              operational: from running; entire CC to be deleted, if addressing xMIM://v1/list-mediator-instances fails'
          category:
            type: string
            enum:
              - 'mediatorVm'
          _template:
            type: string
            description: >
              'mediatorVmTemplateName
              Reference towards an entry in the list of Profiles
              Both instances of ControlConstruct and Profile must have an identical value in their category attributes
              candidate: from [DDM://v1/regard-mediator-vm$request.body#mediator-vm-template-name]
              running: from candidate
              operational: ./. - does not exist in OperationalDS as it cannot be read from the real element'
          default-snmp-user-name:
            type: string
            description: >
              'The SNMP user name is used by the MediatorProcess for addressing the device
              candidate: from [/network-control-domain=candidate/profile=[_template]/default-snmp-user-list=[random]/default-snmp-user-name]
              running: from candidate
              operational: ./. - does not exist in OperationalDS as it cannot be read from the real element'
          default-snmp-user-password:
            type: string
            description: >
              'The SNMP user password is used by the MediatorProcess for addressing the device
              candidate: from [/network-control-domain=candidate/profile=[_template]/default-snmp-user-list=[random]/default-snmp-user-password]
              running: from candidate
              operational: ./. - does not exist in OperationalDS as it cannot be read from the real element'
          default-netconf-user-name:
            type: string
            description: >
              'The NETCONF user name is expected by the MediatorProcess when addressed by the Controller
              candidate: from [DDM://v1/regard-mediator-vm$request.body#default-netconf-user-name]
              running: from candidate
              operational: ./. - does not exist in OperationalDS as it cannot be read from the real element'
          default-netconf-user-password:
            type: string
            description: >
              'The NETCONF user password is expected by the MediatorProcess when addressed by the Controller
              candidate: from [DDM://v1/regard-mediator-vm$request.body#default-netconf-user-password]
              running: from candidate
              operational: ./. - does not exist in OperationalDS as it cannot be read from the real element'
          logical-termination-point:
            type: array
            x-key: local-id
            minItems: 1
            items:
              oneOf:
                - description: 'mediatorInstanceManager'
                  type: object
                  required:
                    - local-id
                    - layer-protocol
                  properties:
                    local-id:
                      type: string
                      enum:
                        - 'mediator-instance-manager'
                    layer-protocol:
                      type: array
                      x-key: local-id
                      minItems: 5
                      maxItems: 5
                      items:
                        oneOf:
                          - description: 'operationServer - provide-mediator-instance'
                            type: object
                            required:
                              - local-id
                              - operation-name
                            properties:
                              local-id:
                                type: string
                                enum:
                                  - 'mim-operation-server-create'
                              operation-name:
                                type: string
                                description: >
                                  'Name of the operation for creating a new mediatorProcess at the xMediatorInstanceManager
                                  candidate: from [/network-control-domain=candidate/profile=[_template]/provide-mediator-instance-operation-name]
                                  running: from candidate
                                  operational: from running (xMIM does not provide the information)'
                          - description: 'operationServer - dismantle-mediator-instance'
                            type: object
                            required:
                              - local-id
                              - operation-name
                            properties:
                              local-id:
                                type: string
                                enum:
                                  - 'mim-operation-server-dismantle'
                              operation-name:
                                type: string
                                description: >
                                  'Name of the operation for dismantling an obsolete mediatorProcess at the xMediatorInstanceManager
                                  candidate: from [/network-control-domain=candidate/profile=[_template]/dismantle-mediator-instance-operation-name]
                                  running: from candidate
                                  operational: from running (xMIM does not provide the information)'
                          - description: 'operationServer - list-mediator-instances'
                            type: object
                            required:
                              - local-id
                              - operation-name
                            properties:
                              local-id:
                                type: string
                                enum:
                                  - 'mim-operation-server-list'
                              operation-name:
                                type: string
                                description: >
                                  'Name of the operation for listing the mediatorProcesses that exist at some mediatorVm
                                  candidate: from [/network-control-domain=candidate/profile=[_template]/list-mediator-instances-operation-name]
                                  running: from candidate
                                  operational: from running (xMIM does not provide the information)'
                          - description: 'httpServer'
                            type: object
                            required:
                              - local-id
                            properties:
                              local-id:
                                type: string
                                enum:
                                  - 'http-server'
                          - description: 'tcpServer'
                            type: object
                            required:
                              - local-id
                              - local-ip-address
                              - local-port
                            properties:
                              local-id:
                                type: string
                                enum:
                                  - 'tcp-server'
                              local-ip-address:
                                type: string
                                description: >
                                  'IP address of the mediatorVm
                                  candidate: from [DDM://v1/regard-mediator-vm$request.body#mediator-vm-ip-address]
                                  running: from candidate
                                  operational: from running, but entire ControlConstruct to be deleted if not responding on xMIM://v1/list-mediator-instances in module OperationalMediatorVmAndProcesses'
                              local-port:
                                type: integer
                                description: >
                                  'TCP port of the management interface (xMediatorInstanceManager) of the mediatorVm
                                  candidate: from [DDM://v1/regard-mediator-vm$request.body#mediator-vm-port]
                                  running: from candidate
                                  operational: from running, but entire ControlConstruct to be deleted if not responding on xMIM://v1/list-mediator-instances in module OperationalMediatorVmAndProcesses'
                - description: 'mediatorProcess - see 22_MediatorProcess.yaml'
                  type: object
