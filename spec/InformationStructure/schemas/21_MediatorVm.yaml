control-construct:
  type: array
  x-key: element-name
  items:
    oneOf:
      - description: 'mediatorVm'
        type: object
        required:
          - element-name
          - category
          - _template
          - logical-termination-point
        properties:
          element-name:
            type: string
            description: >
              'mediatorVmName
              candidate: from [MM://v1/regard-mediator-vm$request.body#mediator-vm-name]
              running: from candidate
              operational: from running, but deleted entire CC from list if not responding on xMIM://v1/list-mediator-instances'
          category:
            type: string
            enum:
              - 'mediatorVm'
          _template:
            type: string
            description: >
              'mediatorVmTemplateName (must match the template-name of a MediatorVmProfile definition)
              candidate: from [DDM://v1/regard-mediator-vm$request.body#mediator-vm-template-name]
              running: from candidate
              operational: from running (xMIM does not provide the information)'
          logical-termination-point:
            type: array
            x-key: local-id
            minItems: 1
            items:
              oneOf:
                - description: 'mediatorInstanceManager'
                  type: object
                  required:
                    - local-id
                    - layer-protocol
                  properties:
                    local-id:
                      type: string
                      enum:
                        - 'mediator-instance-manager'
                    layer-protocol:
                      type: array
                      x-key: server-name
                      minItems: 5
                      maxItems: 5
                      items:
                        oneOf:
                          - description: 'operationServer - provide-mediator-instance'
                            type: object
                            required:
                              - server-name
                              - operation-name
                            properties:
                              server-name:
                                type: string
                                enum:
                                  - 'mim-operation-server-create'
                              operation-name:
                                type: string
                                description: >
                                  'Name of the operation for creating a new mediatorProcess at the xMediatorInstanceManager
                                  candidate: from [/network-control-domain=candidate/profile=[_template]/provide-mediator-instance-operation-name]
                                  running: from candidate
                                  operational: from running (xMIM does not provide the information)'
                          - description: 'operationServer - dismantle-mediator-instance'
                            type: object
                            required:
                              - server-name
                              - operation-name
                            properties:
                              server-name:
                                type: string
                                enum:
                                  - 'mim-operation-server-dismantle'
                              operation-name:
                                type: string
                                description: >
                                  'Name of the operation for dismantling an obsolete mediatorProcess at the xMediatorInstanceManager
                                  candidate: from [/network-control-domain=candidate/profile=[_template]/dismantle-mediator-instance-operation-name]
                                  running: from candidate
                                  operational: from running (xMIM does not provide the information)'
                          - description: 'operationServer - list-mediator-instances'
                            type: object
                            required:
                              - server-name
                              - operation-name
                            properties:
                              server-name:
                                type: string
                                enum:
                                  - 'mim-operation-server-list'
                              operation-name:
                                type: string
                                description: >
                                  'Name of the operation for listing the mediatorProcesses that exist at some mediatorVm
                                  candidate: from [/network-control-domain=candidate/profile=[_template]/list-mediator-instances-operation-name]
                                  running: from candidate
                                  operational: from running (xMIM does not provide the information)'
                          - description: 'httpServer'
                            type: object
                            required:
                              - server-name
                            properties:
                              server-name:
                                type: string
                                enum:
                                  - 'mim-http-server'
                              mediator-user-name:
                                type: string
                                description: >
                                  'User name that is to be used by mediatorProcesses that will be created inside this mediatorVm
                                  candidate: a value, which is not yet used by any other MediatorVm, shall be taken from [/network-control-domain=candidate/profile=[_template]/default-mediator-user=[*]/default-mediator-user-name]

                                  [Prathiba] : Refer the QUERY#1 mentioned in 20_MedistorVMTemplate.yaml for default-mediator-user. So, to find out whether a user-name is in use or not, this attribute shall be refered.
                                  [Thorsten] : Changed the candidate: in such a way that mediator-user-name is NOT taken from requestBody of DDM://v1/regard-mediator-vm, but alway chosen from the values in the template definition.
                                                Yes, this attribute shall be used to find out, whether some value from the list is already in use.

                                  running: from candidate
                                  operational: from ???Huawei_specific_service_for_GET_PUT_defaultMediatorUserName???'

                                  [Prathiba] : For creation, from the candidate content shall be copied.
                                                For updation, As of now DDM dont tunes the configuration in a mediator VM. So, further need to check with Huawei and all the vendors.
                                  [Thorsten] : In the actual mediator implementation the configured mediator-user-name is used for FUTURE MediatorProcess; 
                                                Means that a single MediatorVm could have MediatorProcesses addressing different mediator-user-name.
                                                I would like to avoid this additional complexity.
                                                The DDM shall configure the mediator-user-name once, but it shall be invariant afterwards.

                              mediator-user-password:
                                type: string
                                description: >
                                  'Password that is to be used by mediatorProcesses that will be created inside this mediatorVm
                                  candidate: from [DDM://v1/regard-mediator-vm$request.body#mediator-user-password]
                                              or if not sent, from [/network-control-domain=candidate/profile=[_template]/default-mediator-user=[mediator-user-name]/default-mediator-user-password] is to be taken
                                  running: from candidate
                                  operational: from ???Huawei_specific_service_for_GET_PUT_defaultMediatorUserPassword???'
                          - description: 'tcpServer'
                            type: object
                            required:
                              - server-name
                              - local-ip-address
                              - local-port
                            properties:
                              server-name:
                                type: string
                                enum:
                                  - 'mim-tcp-server'
                              local-ip-address:
                                type: string
                                description: >
                                  'IP address of the mediatorVm
                                  candidate: from [DDM://v1/regard-mediator-vm$request.body#mediator-vm-ip-address]
                                  running: from candidate
                                  operational: from running, but entire ControlConstruct to be deleted if not responding on xMIM://v1/list-mediator-instances in module OperationalMediatorVmAndProcesses'
                              local-port:
                                type: integer
                                description: >
                                  'TCP port of the management interface (xMediatorInstanceManager) of the mediatorVm
                                  candidate: from [DDM://v1/regard-mediator-vm$request.body#mediator-vm-port]
                                  running: from candidate
                                  operational: from running, but entire ControlConstruct to be deleted if not responding on xMIM://v1/list-mediator-instances in module OperationalMediatorVmAndProcesses'
                - description: 'mediatorProcess - see 22_MediatorProcess.yaml'
                  type: object
