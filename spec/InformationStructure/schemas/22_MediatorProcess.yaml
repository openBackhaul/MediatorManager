logical-termination-point:
  type: array
  x-key: local-id
  items:
    oneOf:
      - description: 'mediatorProcess'
        type: object
        required:
          - local-id
          - layer-protocol
        properties:
          local-id:
            type: string
            description: >
              'deviceName
              candidate: from [DDM://v1/establish-management-plane-transport$request.body#device-name]
              running: from candidate
              operational: from running; entire LTP to be deleted, if managementDomain not included in [xMIM://v1/list-mediator-instances$response.body#device-name=[deviceName]/device-name]'
          layer-protocol:
            type: array
            x-key: local-id
            minItems: 4
            maxItems: 4
            items:
              oneOf:
                - description: 'netconfServer'
                  type: object
                  required:
                    - local-id
                    - netconf-user-name
                    - netconf-user-password
                  properties:
                    local-id:
                      type: string
                      enum:
                        - 'netconf-server'
                    netconf-user-name:
                      type: string
                      description: >
                        'The NETCONF user name is expected by the MediatorProcess when addressed by the Controller
                        candidate: from [/control-construct=[mediatorVmName]/default-netconf-user-name]
                        running: from candidate
                        operational: ./. - does not exist in OperationalDS as it cannot be read from the real element'
                    netconf-user-password:
                      type: string
                      description: >
                        'The NETCONF user password is expected by the MediatorProcess when addressed by the Controller
                        candidate: rom [/control-construct=[mediatorVmName]/default-netconf-user-password]
                        running: from candidate
                        operational: ./. - does not exist in OperationalDS as it cannot be read from the real element'
                - description: 'tcpServer'
                  type: object
                  required:
                    - local-id
                    - local-ip-address
                    - local-port
                  properties:
                    local-id:
                      type: string
                      enum:
                        - 'tcp-server'
                    local-ip-address:
                      type: string
                      description: >
                        'IP address of the mediatorProcess
                        candidate: from [xMIM://v1/list-mediator-instances$response.body#device-name=[deviceName]/mediator-instance-netconf-port]
                        running: from candidate
                        operational: from [xMIM://v1/list-mediator-instances$response.body#device-name=[deviceName]/mediator-instance-ip-address]'
                    local-port:
                      type: integer
                      description: >
                        'TCP port of the mediatorProcess
                        candidate: from [xMIM://v1/list-mediator-instances$response.body#device-name=[deviceName]/mediator-instance-netconf-port]
                        running: from candidate
                        operational: from [xMIM://v1/list-mediator-instances$response.body#device-name=[deviceName]/mediator-instance-netconf-port]'
                - description: 'snmpClient'
                  type: object
                  required:
                    - local-id
                    - snmp-user-name
                    - snmp-user-password
                  properties:
                    local-id:
                      type: string
                      enum:
                        - 'snmp-client'
                    snmp-user-name:
                      type: string
                      description: >
                        'The SNMP user name is used by the MediatorProcess for addressing the device
                        candidate: from [/control-construct=[mediatorVmName]/default-snmp-user-name]
                        running: from candidate
                        operational: ./. - does not exist in OperationalDS as it cannot be read from the real element'
                    snmp-user-password:
                      type: string
                      description: >
                        'The SNMP user password is used by the MediatorProcess for addressing the device
                        candidate: from [/control-construct=[mediatorVmName]/default-snmp-user-password]
                        running: from candidate
                        operational: ./. - does not exist in OperationalDS as it cannot be read from the real element'
                - description: 'tcpClient'
                  type: object
                  required:
                    - local-id
                    - remote-ip-address
                    - remote-port
                  properties:
                    local-id:
                      type: string
                      enum:
                        - 'tcp-client'
                    remote-ip-address:
                      type: string
                      description: >
                        'IP address of the device to which the mediatorProcess is connected to
                        candidate: from [DDM://v1/establish-management-plane-transport$request.body#device-ip-address]
                        running: from candidate
                        operational: from [xMIM://v1/list-mediator-instances$response.body#device-name=[deviceName]/device-ip-address]'
                    remote-port:
                      type: integer
                      minimum: 161
                      maximum: 161
                      description: 'TCP port of the device to which the mediatorProcess is connected to'
