error-code:
  type: array
  x-key: error-code
  description: 'List of ErrorCodes with descriptions and corresponding ImplementationFunction'
  items:
    type: object
    required:
      - error-code
      - description
    properties:
      error-code:
        type: integer
        description: >
          'Code for identifying the finding (value must be unique and invariant)
          400-599: Standard response codes are preferably to be used for responding and notifying to external
          600-899: Self-defined response codes can be used also for responding and notifying to external, but re-use across applications must be managed via the documentation of the ApplicationPattern
          900-999: Self-defined response codes can be used for internal management, without alignment between applications'
      description:
        type: string
        description: >
          'Internal codes: Meaningful description of the finding needed for understanding the mechanics of the application
          External codes: Also used as ErrorMessage for addressing humans'
      _implementation-function:
        type: string
        description: >
          'Only applicable for internal codes
          Ideally, each internal code would be handled by a function'
example:
  - error-code: 532
    description: 'Response in case the server is acting as a gateway or proxy and was unable to connect to the upstream server (device or application providing a consumed service)'
  - error-code:
    description:
    _implementation-function:
