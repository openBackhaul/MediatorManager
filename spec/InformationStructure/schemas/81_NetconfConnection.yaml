link:
  type: array
  x-key: local-id
  items:
    oneOf:
      - description: 'netconfLink'
        type: object
        required:
          - local-id
          - linktp
        properties:
          local-id:
            type: string
            description: 'Identifier that is unique within the list of Links'
          linktp:
            type: array
            x-key: interface-type
            minItems: 2
            maxItems: 2
            items:
              oneOf:
                - description: netconfClient
                  type: object
                  required:
                    - interface-type
                    - _cc
                    - _ltp
                    - _lp
                  properties:
                    interface-type:
                      type: string
                      enum:
                        - 'netconf-client'
                    _cc:
                      type: string
                      description: >
                        'controllerName
                        candidate: from [DDM://v1/establish-management-plane-transport$request.body#controller-name]
                        running: from candidate
                        operational: from ???
                    _ltp:
                      type: string
                      description: >
                        'deviceName
                        candidate: from [DDM://v1/establish-management-plane-transport$request.body#device-name]
                        running: from candidate
                        operational: from ???
                    _lp:
                      type: string
                      enum:
                        - 'netconf-client'
                - description: netconfServer
                  type: object
                  required:
                    - interface-type
                    - _cc
                    - _ltp
                    - _lp
                  properties:
                    interface-type:
                      type: string
                      enum:
                        - 'netconf-server'
                    _cc:
                      type: string
                      description: >
                        'mediatorVmName
                        candidate: from [mediatorVm that is addressed by the module that sends the request to xMIM://v1/provide-mediator-instance]
                        running: from candidate
                        operational: from ???
                    _ltp:
                      type: string
                      description: >
                        'deviceName
                        candidate: from [DDM://v1/establish-management-plane-transport$request.body#device-name]
                        running: from candidate
                        operational: from ???
                    _lp:
                      type: string
                      enum:
                        - 'netconf-server'
