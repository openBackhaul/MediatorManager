link:
  type: array
  x-key: local-id
  items:
    oneOf:
      - description: 'netconfLink'
        type: object
        required:
          - local-id
          - linktp
        properties:
          local-id:
            type: string
            description: 'Identifier that is unique within the list of Links'
          linktp:
            type: array
            x-key: local-id
            minItems: 2
            maxItems: 2
            items:
              oneOf:
                - description: netconfClient
                  type: object
                  required:
                    - local-id
                    - _cc
                    - _ltp
                    - _lp
                  properties:
                    local-id:
                      type: string
                      enum:
                        - netconf-client
                    _cc:
                      type: string
                      description: >
                        'ControllerName
                        candidate: from [/network-control-domain=candidate/forwarding-domain=management-plane-transport/forwarding-construct=[deviceName]/fctp=management-plane-transport-client/_cc]
                        running: from candidate
                        operational: from ???
                    _ltp:
                      type: string
                      description: >
                        'MountName of Device
                        candidate: ???is it required to reference???
                        running: from candidate
                        operational: from ???
                    _lp:
                      type: string
                      enum:
                        - netconf-client
                - description: netconfServer
                  type: object
                  required:
                    - local-id
                    - _cc
                    - _ltp
                    - _lp
                  properties:
                    local-id:
                      type: string
                      enum:
                        - netconf-server
                    _cc:
                      type: string
                      description: >
                        'mediatorVmName
                        candidate: from [mediatorVm that is addressed by the module that sends the request to xMIM://v1/provide-mediator-instance]
                        running: from candidate
                        operational: from ???
                    _ltp:
                      type: string
                      description: >
                        'deviceName
                        candidate: ???is it required to reference???
                        running: from candidate
                        operational: from ???
                    _lp:
                      type: string
                      enum:
                        - netconf-server
