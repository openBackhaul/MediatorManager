control-construct:
  type: array
  x-key: element-name
  items:
    oneOf:
      - description: 'device'
        type: object
        required:
          - element-name
          - category
          - _template
          - logical-termination-point
        properties:
          element-name:
            type: string
            description: >
              'deviceName
              candidate: from [DDM://v1/establish-management-plane-transport$request.body#device-name]
              running: from candidate
              operational: from running; entire CC to be deleted, if addressing the Device (e.g. Ping, or Live path in MWDI) fails'
          category:
            type: string
            enum:
              - 'device'
          _template:
            type: string
            description: >
              'deviceTemplateName
              Reference towards an entry in the list of Profiles
              Both instances of ControlConstruct and Profile must have an identical value in their category attributes
              candidate: from [DDM://v1/establish-management-plane-transport$request.body#device-kind-name]
              running: from candidate
              operational: ./. - does not exist in OperationalDS as it cannot be read from the real element'
          logical-termination-point:
            type: array
            x-key: local-id
            minItems: 1
            maxItems: 1
            items:
              type: object
              required:
                - local-id
                - layer-protocol
              properties:
                local-id:
                  type: string
                  enum:
                    - 'management'
                layer-protocol:
                  type: array
                  x-key: local-id
                  minItems: 2
                  items:
                    oneOf:
                      - description: 'snmpServer'
                        type: object
                        required:
                          - local-id
                          - snmp-user-name
                          - snmp-user-password
                        properties:
                          local-id:
                            type: string
                            description: >
                              'snmpUserName, an instance of snmpServer is to be created for every MediatorProcess that shall address the Device
                              candidate: from [/network-control-domain=candidate/control-construct=[mediatorVmName]/logical-termination-point=[deviceName]/layer-protocol=snmp-client/snmp-user-name]
                              running: from candidate
                              operational: [Thorsten - preliminary proposal] from running, but entire LP to be deleted if not included in [CP://v1/provide-connection-data$response.body#user-list/user-name]'
                          snmp-user-name:
                            type: string
                            description: >
                              'The SNMP user name is expected by the device while being addressed by the MediatorProcess
                              It shall be configured by the ConnectionPreparation after receiving the value from DDM
                              candidate: from [/network-control-domain=candidate/control-construct=[mediatorVmName]/logical-termination-point=[deviceName]/layer-protocol=snmp-client/snmp-user-name]
                              running: from candidate
                              operational: ./.
                          snmp-user-password:
                            type: string
                            description: >
                              'The SNMP user password is expected by the device while being addressed by the MediatorProcess
                              It shall be configured by the ConnectionPreparation after receiving the value from DDM
                              candidate: from [/network-control-domain=candidate/control-construct=[mediatorVmName]/logical-termination-point=[deviceName]/layer-protocol=snmp-client/snmp-user-password]
                              running: from candidate
                              operational: ./.
                      - description: 'tcpServer'
                        type: object
                        required:
                          - local-id
                          - local-ip-address
                          - local-port
                        properties:
                          local-id:
                            type: string
                            enum:
                              - 'tcp-server'
                          local-ip-address:
                            type: string
                            description: >
                              'IP address of the device
                              candidate: from [DDM://v1/establish-management-plane-transport$request.body#device-ip-address]
                              running: from candidate
                              operational: from running, ???if device could not be reached while attempting to read the control-construct/externalLabel, the entire ControlConstruct to be deleted from network-control-domain=operational???'
                          local-port:
                            type: integer
                            minimum: 161
                            maximum: 161
                            description: 'Using 161 as a default is abstracting that Huawei is not using SNMP, but Qx.'
