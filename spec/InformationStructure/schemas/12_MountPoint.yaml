logical-termination-point:
  type: array
  x-key: local-id
  items:
    type: object
    required:
      - local-id
      - layer-protocol
    properties:
      local-id:
        type: string
        description: >
          'deviceName
          candidate: from [DDM://v1/establish-management-plane-transport$request.body#device-name]
          running: from candidate
          operational: from running; entire LTP to be deleted, if deviceName not included in [CDM://v1/provide-list-of-mount-points-at-controller$response.body#mount-names]'
      layer-protocol:
        type: array
        x-key: local-id
        minItems: 2
        maxItems: 2
        items:
          oneOf:
            - description: 'netconfClient'
              type: object
              required:
                - local-id
                - netconf-user-name
                - netconf-user-password
              properties:
                local-id:
                  type: string
                  enum:
                    - 'netconf-client'
                netconf-user-name:
                  type: string
                  description: >
                    'The NETCONF user name is used by the MountPoint for addressing the MediatorProcess
                    It shall be configured by the CDM after receiving the value from DDM
                    candidate: from [/network-control-domain=candidate/control-construct=[mediatorVmName]/logical-termination-point=[deviceName]/layer-protocol=netconf-server/netconf-user-name]
                    running: from candidate
                    operational: from [CDM://v1/inform-about-mount-point$response.body#netconf-user-name]'
                netconf-user-password:
                  type: string
                  description: >
                    'The NETCONF user password is used by the MountPoint for addressing the MediatorProcess
                    It shall be configured by the CDM after receiving the value from DDM
                    candidate: from [/network-control-domain=candidate/control-construct=[mediatorVmName]/logical-termination-point=[deviceName]/layer-protocol=netconf-server/netconf-user-password]
                    running: from candidate
                    operational: from [CDM://v1/inform-about-mount-point$response.body#netconf-user-password]'
            - description: 'tcpClient'
              type: object
              required:
                - local-id
                - remote-ip-address
                - remote-port
              properties:
                local-id:
                  type: string
                  enum:
                    - 'tcp-client'
                remote-ip-address:
                  type: string
                  description: >
                    'IP address of the mediatorProcess to which the mountPoint is connected to
                    candidate: initially empty; from [xMIM://v1/provide-mediator-instance$response.body#mediator-instance-ip-address]

                    [Prathiba] Whether in the interpretation module XMIM will be called to create a mediator instance ? or the implementation module will do it ?
                    [Thorsten] xMIM will be called as a part of the implementation; after interpretation and during validation this attribute is empty;

                    running: from candidate
                    operational: from [CDM://v1/inform-about-mount-point$response.body#remote-ip-address]'
                remote-port:
                  type: integer
                  description: >
                    'TCP port of the mediatorProcess to which the mountPoint is connected to
                    candidate: initially empty; from [xMIM://v1/provide-mediator-instance$response.body#mediator-instance-netconf-port]
                    running: from candidate
                    operational: from [CDM://v1/inform-about-mount-point$response.body#remote-port]'
