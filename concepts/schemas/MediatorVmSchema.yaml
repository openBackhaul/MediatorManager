core-model-1-4:control-construct:
  type: object
  required:
    - uuid
    - operational-state
    - lifecycle-state
    - profile-collection
    - logical-termination-point
    - forwarding-domain
  properties:
    uuid:
      type: string
      pattern: '^([a-z]{2,6})-0-0-([0-9]{1,2})$'
      description: >
        'Unique identifier of the mediatorVm composed from the mediatorVmTemplateName and a sequence number.
        The pattern must be kept for the mediatorVm being accepted as an application.
        from [MM://v1/regard-mediator-instance-manager$request.body#mediator-vm-template-name]-0-0-[automatically generated sequence number that is unique for the same mediatorVmTemplateName]'
    operational-state:
      type: string
      enum:
        - core-model-1-4:OPERATIONAL_STATE_ENABLED
        - core-model-1-4:OPERATIONAL_STATE_DISABLED
      description: >
        'IF xMIM://v1/list-mediator-instances is not responding, THEN operational state = disabled.'
    lifecycle-state:
      type: string
      enum:
        - core-model-1-4:LIFECYCLE_STATE_PLANNED
        - core-model-1-4:LIFECYCLE_STATE_POTENTIAL_AVAILABLE
        - core-model-1-4:LIFECYCLE_STATE_POTENTIAL_BUSY
        - core-model-1-4:LIFECYCLE_STATE_INSTALLED
        - core-model-1-4:LIFECYCLE_STATE_PENDING_REMOVAL
      description: >
        'IF MM://v1/disregard-mediator-instance-manager has been addressed, THEN lifecycle state = pending removal.
        IF number of mediatorProcesses reached engineeringLimit of referenced mediatorVmTemplate, THEN lifecycle state = potential busy.
        Installed is default, planned and potential available currently not used.'
    profile-collection:
      type: object
      required:
        - profile
      properties:
        profile:
          type: array
          uniqueItems: true
          minItems: 1
          maxItems: 2
          items:
            oneOf:
              - description: 'string profile - mediatorVmTemplateName'
                type: object
                required:
                  - uuid
                  - profile-name
                  - string-profile-1-0:string-profile-pac
                properties:
                  uuid:
                    type: string
                    pattern: '^([a-z]{2,6})-0-0-([0-9]{1,2})-string-p-000$'
                    description: 'Unique identifier of the StringProfile composed from the control-construct::uuid and -string-p-000'
                  profile-name:
                    type: string
                    enum:
                      - 'string-profile-1-0:PROFILE_NAME_TYPE_STRING_PROFILE'
                  string-profile-1-0:string-profile-pac:
                    type: object
                    required:
                      - string-profile-capability
                      - string-profile-configuration
                    properties:
                      string-profile-capability:
                        type: object
                        required:
                          - string-name
                        properties:
                          string-name:
                            type: string
                            enum:
                              - 'mediatorVmTemplateName'
                      string-profile-configuration:
                        type: object
                        required:
                          - string-value
                        properties:
                          string-value:
                            type: string
                            description: >
                              'mediatorVmTemplate from which this mediatorVm is derived from
                              from [MM://v1/regard-mediator-instance-manager$request.body#mediator-vm-template-name]'
              - description: 'string profile - mediatorUserName'
                type: object
                required:
                  - uuid
                  - profile-name
                  - string-profile-1-0:string-profile-pac
                properties:
                  uuid:
                    type: string
                    pattern: '^([a-z]{2,6})-0-0-([0-9]{1,2})-string-p-001$'
                    description: 'Unique identifier of the StringProfile composed from the control-construct::uuid and -string-p-001'
                  profile-name:
                    type: string
                    enum:
                      - 'string-profile-1-0:PROFILE_NAME_TYPE_STRING_PROFILE'
                  string-profile-1-0:string-profile-pac:
                    type: object
                    required:
                      - string-profile-capability
                      - string-profile-configuration
                    properties:
                      string-profile-capability:
                        type: object
                        required:
                          - string-name
                        properties:
                          string-name:
                            type: string
                            enum:
                              - 'mediatorUserName'
                      string-profile-configuration:
                        type: object
                        required:
                          - string-value
                        properties:
                          string-value:
                            type: string
                            description: >
                              'User name that is used by the mediatorProcesses inside this mediatorVm while connecting to the management interface of the device.
                              from [referenced mediatorVmTemplate#mediatorUserList/mediatorUserName]'
              - description: 'string profile - password'
                type: object
                required:
                  - uuid
                  - profile-name
                  - string-profile-1-0:string-profile-pac
                properties:
                  uuid:
                    type: string
                    pattern: '^([a-z]{2,6})-0-0-([0-9]{1,2})-string-p-002$'
                    description: 'Unique identifier of the StringProfile composed from the control-construct::uuid and -string-p-002'
                  profile-name:
                    type: string
                    enum:
                      - 'string-profile-1-0:PROFILE_NAME_TYPE_STRING_PROFILE'
                  string-profile-1-0:string-profile-pac:
                    type: object
                    required:
                      - string-profile-capability
                      - string-profile-configuration
                    properties:
                      string-profile-capability:
                        type: object
                        required:
                          - string-name
                        properties:
                          string-name:
                            type: string
                            enum:
                              - 'password'
                      string-profile-configuration:
                        type: object
                        required:
                          - string-value
                        properties:
                          string-value:
                            type: string
                            description: >
                              'User name that is used by the mediatorProcesses inside this mediatorVm while connecting to the management interface of the device.
                              from [referenced mediatorVmTemplate#mediatorUserList/mediatorUserPassword]'
    logical-termination-point:
      type: array
      uniqueItems: true
      minItems: 5
      items:
        oneOf:
          - description: 'tcp server'
            type: object
            required:
              - uuid
              - ltp-direction
              - client-ltp
              - server-ltp
              - layer-protocol
            properties:
              uuid:
                type: string
                pattern: '^([a-z]{2,6})-0-0-([0-9]{1,2})-tcp-s-000$'
                description: 'Unique identifier of the TcpServer composed from the control-construct::uuid and -tcp-s-000'
              ltp-direction:
                type: string
                enum:
                  - 'core-model-1-4:TERMINATION_DIRECTION_SOURCE'
              client-ltp:
                type: array
                uniqueItems: true
                minItems: 1
                items:
                  type: string
                  pattern: '^([a-z]{2,6})-0-0-([0-9]{1,2})-http-s-([0-9]{3})$'
                  description: 'Identifier of the client HttpServers'
              server-ltp:
                type: array
                uniqueItems: true
                minItems: 0
                maxItems: 0
                items:
                  type: string
              layer-protocol:
                type: array
                minItems: 1
                maxItems: 1
                items:
                  type: object
                  required:
                    - local-id
                    - layer-protocol-name
                    - tcp-server-interface-1-0:tcp-server-interface-pac
                  properties:
                    local-id:
                      type: string
                      enum:
                        - '0'
                    layer-protocol-name:
                      type: string
                      enum:
                        - 'tcp-server-interface-1-0:LAYER_PROTOCOL_NAME_TYPE_TCP_LAYER'
                    tcp-server-interface-1-0:tcp-server-interface-pac:
                      type: object
                      required:
                        - tcp-server-interface-configuration
                      properties:
                        tcp-server-interface-configuration:
                          type: object
                          required:
                            - description
                            - local-protocol
                            - local-address
                            - local-port
                          properties:
                            description:
                              type: string
                              enum: ''
                              description: 'Not used'
                            local-protocol:
                              type: string
                              description: >
                                'Protocol for addressing the mediatorVm
                                from [MM://v1/regard-mediator-instance-manager$request.body#mediator-instance-manager-protocol]'
                            local-address:
                              type: object
                              minProperties: 1
                              maxProperties: 1
                              additionalProperties: false
                              properties:
                                ipv-4-address:
                                  type: string
                                  description: >
                                    'IP address of the mediatorVm
                                    from [MM://v1/regard-mediator-instance-manager$request.body#mediator-instance-manager-ip-address]'
                                domain-name:
                                  type: string
                                  description: 'Not used'
                            local-port:
                              type: integer
                              description: >
                                'IP address of the mediatorVm
                                from [MM://v1/regard-mediator-instance-manager$request.body#mediator-instance-manager-port]'
          - description: 'http server'
            type: object
            required:
              - uuid
              - ltp-direction
              - client-ltp
              - server-ltp
              - layer-protocol
            properties:
              uuid:
                type: string
                pattern: '^([a-z]{2,6})-0-0-([0-9]{1,2})-http-s-000$'
                description: 'Unique identifier of the HttpServer composed from the control-construct::uuid and -http-s-000'
              ltp-direction:
                type: string
                enum:
                  - 'core-model-1-4:TERMINATION_DIRECTION_SOURCE'
              client-ltp:
                type: array
                uniqueItems: true
                minItems: 3
                maxItems: 3
                items:
                  type: string
                  pattern: '^([a-z]{2,6})-0-0-([0-9]{1,2})-op-s-00([0-2]{1})$'
                  description: 'Identifier of the client OperationServers'
              server-ltp:
                type: array
                uniqueItems: true
                minItems: 1
                maxItems: 1
                items:
                  type: string
                  pattern: '^([a-z]{2,6})-0-0-([0-9]{1,2})-tcp-s-000$'
                  description: 'Identifier of the serving TcpServer'
              layer-protocol:
                type: array
                minItems: 1
                maxItems: 1
                items:
                  type: object
                  required:
                    - local-id
                    - layer-protocol-name
                    - http-server-interface-1-0:http-server-interface-pac
                  properties:
                    local-id:
                      type: string
                      enum:
                        - '0'
                    layer-protocol-name:
                      type: string
                      enum:
                        - 'http-server-interface-1-0:LAYER_PROTOCOL_NAME_TYPE_HTTP_LAYER'
                    http-server-interface-1-0:http-server-interface-pac:
                      type: object
                      required:
                        - http-server-interface-capability
                      properties:
                        http-server-interface-capability:
                          type: object
                          required:
                            - application-name
                            - release-number
                            - application-purpose
                            - data-update-period
                            - owner-name
                            - owner-email-address
                            - release-list
                          properties:
                            application-name:
                              type: string
                              description: >
                                'from [MM://v1/regard-mediator-instance-manager$request.body#mediator-vm-template-name]'
                            release-number:
                              type: string
                              description: >
                                'from 0.0.[same sequence number as in control-construct::uuid]
                            application-purpose:
                              type: string
                              enum:
                                - 'Management interface to mediatorVm'
                            data-update-period:
                              type: string
                              enum:
                                - 'http-server-interface-1-0:DATA_UPDATE_PERIOD_TYPE_1H_PERIOD'
                            owner-name:
                              type: string
                              enum:
                                - ''
                            owner-email-address:
                              type: string
                              enum:
                                - ''
                            release-list:
                              type: array
          - description: 'operation server - /v1/provide-mediator-instance'
            type: object
            required:
              - uuid
              - ltp-direction
              - client-ltp
              - server-ltp
              - layer-protocol
            properties:
              uuid:
                type: string
                pattern: '^([a-z]{2,6})-0-0-([0-9]{1,2})-op-s-000$'
                description: 'Unique identifier of the OperationServer composed from the control-construct::uuid and -op-s-000'
              ltp-direction:
                type: string
                enum:
                  - 'core-model-1-4:TERMINATION_DIRECTION_SOURCE'
              client-ltp:
                type: array
                uniqueItems: true
                minItems: 0
                maxItems: 0
                items:
                  type: string
              server-ltp:
                type: array
                uniqueItems: true
                minItems: 1
                maxItems: 1
                items:
                  type: string
                  pattern: '^([a-z]{2,6})-0-0-([0-9]{1,2})-http-s-000$'
                  description: 'Identifier of the serving HttpServer'
              layer-protocol:
                type: array
                minItems: 1
                maxItems: 1
                items:
                  type: object
                  required:
                    - local-id
                    - layer-protocol-name
                    - operation-server-interface-1-0:operation-server-interface-pac
                  properties:
                    local-id:
                      type: string
                      enum:
                        - '0'
                    layer-protocol-name:
                      type: string
                      enum:
                        - 'operation-server-interface-1-0:LAYER_PROTOCOL_NAME_TYPE_OPERATION_LAYER'
                    operation-server-interface-1-0:operation-server-interface-pac:
                      type: object
                      required:
                        - operation-server-interface-capability
                        - operation-server-interface-configuration
                      properties:
                        operation-server-interface-capability:
                          type: object
                          required:
                            - operation-name
                          properties:
                            operation-name:
                              type: string
                              enum:
                                - '/v1/provide-mediator-instance'
                        operation-server-interface-configuration:
                          type: object
                          required:
                            - life-cycle-state
                            - operation-key
                          properties:
                            life-cycle-state:
                              type: string
                              enum:
                                - 'operation-server-interface-1-0:LIFE_CYCLE_STATE_TYPE_OPERATIONAL'
                            operation-key:
                              type: string
                              enum:
                                - 'n.a.'
          - description: 'operation server - /v1/dismantle-mediator-instance'
            type: object
            required:
              - uuid
              - ltp-direction
              - client-ltp
              - server-ltp
              - layer-protocol
            properties:
              uuid:
                type: string
                pattern: '^([a-z]{2,6})-0-0-([0-9]{1,2})-op-s-001$'
                description: 'Unique identifier of the OperationServer composed from the control-construct::uuid and -op-s-001'
              ltp-direction:
                type: string
                enum:
                  - 'core-model-1-4:TERMINATION_DIRECTION_SOURCE'
              client-ltp:
                type: array
                uniqueItems: true
                minItems: 0
                maxItems: 0
                items:
                  type: string
              server-ltp:
                type: array
                uniqueItems: true
                minItems: 1
                maxItems: 1
                items:
                  type: string
                  pattern: '^([a-z]{2,6})-0-0-([0-9]{1,2})-http-s-000$'
                  description: 'Identifier of the serving HttpServer'
              layer-protocol:
                type: array
                minItems: 1
                maxItems: 1
                items:
                  type: object
                  required:
                    - local-id
                    - layer-protocol-name
                    - operation-server-interface-1-0:operation-server-interface-pac
                  properties:
                    local-id:
                      type: string
                      enum:
                        - '0'
                    layer-protocol-name:
                      type: string
                      enum:
                        - 'operation-server-interface-1-0:LAYER_PROTOCOL_NAME_TYPE_OPERATION_LAYER'
                    operation-server-interface-1-0:operation-server-interface-pac:
                      type: object
                      required:
                        - operation-server-interface-capability
                        - operation-server-interface-configuration
                      properties:
                        operation-server-interface-capability:
                          type: object
                          required:
                            - operation-name
                          properties:
                            operation-name:
                              type: string
                              enum:
                                - '/v1/dismantle-mediator-instance'
                        operation-server-interface-configuration:
                          type: object
                          required:
                            - life-cycle-state
                            - operation-key
                          properties:
                            life-cycle-state:
                              type: string
                              enum:
                                - 'operation-server-interface-1-0:LIFE_CYCLE_STATE_TYPE_OPERATIONAL'
                            operation-key:
                              type: string
                              enum:
                                - 'n.a.'
          - description: 'operation server - /v1/list-mediator-instances'
            type: object
            required:
              - uuid
              - ltp-direction
              - client-ltp
              - server-ltp
              - layer-protocol
            properties:
              uuid:
                type: string
                pattern: '^([a-z]{2,6})-0-0-([0-9]{1,2})-op-s-002$'
                description: 'Unique identifier of the OperationServer composed from the control-construct::uuid and -op-s-002'
              ltp-direction:
                type: string
                enum:
                  - 'core-model-1-4:TERMINATION_DIRECTION_SOURCE'
              client-ltp:
                type: array
                uniqueItems: true
                minItems: 0
                maxItems: 0
                items:
                  type: string
              server-ltp:
                type: array
                uniqueItems: true
                minItems: 1
                maxItems: 1
                items:
                  type: string
                  pattern: '^([a-z]{2,6})-0-0-([0-9]{1,2})-http-s-000$'
                  description: 'Identifier of the serving HttpServer'
              layer-protocol:
                type: array
                minItems: 1
                maxItems: 1
                items:
                  type: object
                  required:
                    - local-id
                    - layer-protocol-name
                    - operation-server-interface-1-0:operation-server-interface-pac
                  properties:
                    local-id:
                      type: string
                      enum:
                        - '0'
                    layer-protocol-name:
                      type: string
                      enum:
                        - 'operation-server-interface-1-0:LAYER_PROTOCOL_NAME_TYPE_OPERATION_LAYER'
                    operation-server-interface-1-0:operation-server-interface-pac:
                      type: object
                      required:
                        - operation-server-interface-capability
                        - operation-server-interface-configuration
                      properties:
                        operation-server-interface-capability:
                          type: object
                          required:
                            - operation-name
                          properties:
                            operation-name:
                              type: string
                              enum:
                                - '/v1/list-mediator-instances'
                        operation-server-interface-configuration:
                          type: object
                          required:
                            - life-cycle-state
                            - operation-key
                          properties:
                            life-cycle-state:
                              type: string
                              enum:
                                - 'operation-server-interface-1-0:LIFE_CYCLE_STATE_TYPE_OPERATIONAL'
                            operation-key:
                              type: string
                              enum:
                                - 'n.a.'
    forwarding-domain:
      type: array
      minItems: 1
      maxItems: 1
      items:
        type: object
        required:
          - uuid
          - forwarding-construct
        properties:
          uuid:
            type: string
            pattern: '^([a-z]{2,6})-0-0-([0-9]{1,2})-med-fd-000$'
            description: 'Unique identifier of the mediationForwardingDomain composed from the control-construct::uuid and -med-fd-000'
          forwarding-construct:
            type: array
            items:
              type: object
