core-model-1-4:network-control-domain:
  type: array
  minItems: 2
  maxItems: 2
  items:
    type: object
    required:
      - uuid
      - alarms-1-0:alarm-pac
      - control-construct
      - link
    properties:
      uuid:
        type: string
        enum:
          - 'targetstate'
          - 'currentstate'
      control-construct:
        type: array
        uniqueItems: true
        items:
          oneOf:
            - description: 'controller - see ControllerSchema.yaml'
              type: object
            - description: 'mediatorVm - see MediatorVmSchema.yaml'
              type: object
            - description: 'device - see DeviceSchema.yaml'
              type: object
      link:
        type: array
        uniqueItems: true
        items:
          oneOf:
            - description: 'snmpLink - see SnmpLinkSchema.yaml'
              type: object
            - description: 'netconfLink - see NetconfLinkSchema.yaml'
              type: object
