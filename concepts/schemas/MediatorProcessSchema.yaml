core-model-1-4:control-construct:
  type: array
  items:
    type: object
    properties:
      logical-termination-point:
        type: array
        uniqueItems: true
        items:
          oneOf:
            - description: 'netconf server'
              type: object
              required:
                - uuid
                - ltp-direction
                - client-ltp
                - server-ltp
                - layer-protocol
              properties:
                uuid:
                  type: string
                  description: >
                    'Unique identifier of the NETCONF interface composed from the Network Element ID and -netconf-s-000
                    from [MM://v1/provide-netconf-interface$request.body#mount-name]-netconf-s-000'
                ltp-direction:
                  type: string
                  enum:
                    - 'core-model-1-4:TERMINATION_DIRECTION_SOURCE'
                client-ltp:
                  type: array
                  uniqueItems: true
                  minItems: 0
                  maxItems: 0
                  items:
                    type: string
                server-ltp:
                  type: array
                  uniqueItems: true
                  minItems: 1
                  maxItems: 1
                  items:
                    type: string
                    description: 'Identifier of the serving TcpServer'
                layer-protocol:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: object
                    required:
                      - local-id
                      - layer-protocol-name
                      - netconf-server-interface-1-0:netconf-server-interface-pac
                    properties:
                      local-id:
                        type: string
                        enum:
                          - '0'
                      layer-protocol-name:
                        type: string
                        enum:
                          - 'netconf-server-interface-1-0:LAYER_PROTOCOL_NAME_TYPE_NETCONF_LAYER'
                      netconf-server-interface-1-0:netconf-server-interface-pac:
                        type: object
                        required:
                          - netconf-server-interface-capability
                          - netconf-server-interface-status
                        properties:
                          netconf-server-interface-capability:
                            type: object
                            required:
                              - device-name
                            properties:
                              device-name:
                                type: string
                                pattern: '^(?:\d{3}(?:25|27)\d{4}|\d{3}55\d{4}[AB])$'
                                description: >
                                  'Network Element ID
                                  from [MM://v1/provide-netconf-interface$request.body#mount-name]'
                          netconf-server-interface-status:
                            type: object
                            required:
                              - interface-status
                            properties:
                              interface-status:
                                type: string
                                enum:
                                  - 'netconf-server-interface-1-0:INTERFACE_STATUS_TYPE_UP'
                                  - 'netconf-server-interface-1-0:INTERFACE_STATUS_TYPE_DOWN'
                                  - 'netconf-server-interface-1-0:INTERFACE_STATUS_TYPE_UNKNOWN'
                                  - 'netconf-server-interface-1-0:INTERFACE_STATUS_TYPE_NOT_YET_DEFINED'
                                description: >
                                  'Status of the NETCONF interface updated by regularly querying an attribute using an internal test NetconfClient
                                  not yet defined = feature not implemented
                                  unknown = feature implemented, but currently no result
                                  up = if internal test NetconfClient could succcessfully read some attribute from the device
                                  down = if reading the attribute failed'
            - description: 'tcp server'
              type: object
              required:
                - uuid
                - ltp-direction
                - client-ltp
                - server-ltp
                - layer-protocol
              properties:
                uuid:
                  type: string
                  description: >
                    'Unique identifier of the TcpServer composed from the Network Element ID and -tcp-s-000
                    from [MM://v1/provide-netconf-interface$request.body#mount-name]-tcp-s-000'
                ltp-direction:
                  type: string
                  enum:
                    - 'core-model-1-4:TERMINATION_DIRECTION_SOURCE'
                client-ltp:
                  type: array
                  uniqueItems: true
                  minItems: 1
                  maxItems: 1
                  items:
                    type: string
                    description: 'Identifier of the client NetconfServer'
                server-ltp:
                  type: array
                  uniqueItems: true
                  minItems: 0
                  maxItems: 0
                  items:
                    type: string
                layer-protocol:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: object
                    required:
                      - local-id
                      - layer-protocol-name
                      - tcp-server-interface-1-0:tcp-server-interface-pac
                    properties:
                      local-id:
                        type: string
                        enum:
                          - '0'
                      layer-protocol-name:
                        type: string
                        enum:
                          - 'tcp-server-interface-1-0:LAYER_PROTOCOL_NAME_TYPE_TCP_LAYER'
                      tcp-server-interface-1-0:tcp-server-interface-pac:
                        type: object
                        required:
                          - tcp-server-interface-configuration
                        properties:
                          tcp-server-interface-configuration:
                            type: object
                            required:
                              - local-address
                              - local-port
                            properties:
                              local-address:
                                type: object
                                minProperties: 1
                                maxProperties: 1
                                additionalProperties: false
                                properties:
                                  ipv-4-address:
                                    type: string
                                    description: >
                                      'IP address of the NETCONF interface
                                      from [xMIM://v1/provide-mediator-instance$response.body#mediator-instance-ip-address]'
                              local-port:
                                type: integer
                                description: >
                                  'TCP port of the NETCONF interface
                                  from [xMIM://v1/provide-mediator-instance$response.body#mediator-instance-netconf-port]'
            - description: 'snmp client'
              type: object
              required:
                - uuid
                - ltp-direction
                - client-ltp
                - server-ltp
                - layer-protocol
              properties:
                uuid:
                  type: string
                  description: >
                    'Unique identifier of the SnmpClient composed from the Network Element ID and -snmp-c-000
                    from [MM://v1/provide-netconf-interface$request.body#mount-name]-snmp-c-000'
                ltp-direction:
                  type: string
                  enum:
                    - 'core-model-1-4:TERMINATION_DIRECTION_SINK'
                client-ltp:
                  type: array
                  uniqueItems: true
                  minItems: 0
                  maxItems: 0
                  items:
                    type: string
                server-ltp:
                  type: array
                  uniqueItems: true
                  minItems: 1
                  maxItems: 1
                  items:
                    type: string
                    description: 'Identifier of the serving TcpClient'
                layer-protocol:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: object
                    required:
                      - local-id
                      - layer-protocol-name
                      - snmp-client-interface-1-0:snmp-client-interface-pac
                    properties:
                      local-id:
                        type: string
                        enum:
                          - '0'
                      layer-protocol-name:
                        type: string
                        enum:
                          - 'snmp-client-interface-1-0:LAYER_PROTOCOL_NAME_TYPE_SNMP_LAYER'
                      snmp-client-interface-1-0:snmp-client-interface-pac:
                        type: object
                        required:
                          - snmp-client-interface-capability
                        properties:
                          snmp-client-interface-capability:
                            type: object
                            required:
                              - device-name
                            properties:
                              device-name:
                                type: string
                                pattern: '^(?:\d{3}(?:25|27)\d{4}|\d{3}55\d{4}[AB])$'
                                description: >
                                  'Network Element ID
                                  from [MM://v1/provide-netconf-interface$request.body#mount-name]'
            - description: 'tcp client'
              type: object
              required:
                - uuid
                - ltp-direction
                - client-ltp
                - server-ltp
                - layer-protocol
              properties:
                uuid:
                  type: string
                  description: >
                    'Unique identifier of the TcpClient composed from the Network Element ID and -tcp-c-000
                    from [MM://v1/provide-netconf-interface$request.body#mount-name]-tcp-c-000'
                ltp-direction:
                  type: string
                  enum:
                    - 'core-model-1-4:TERMINATION_DIRECTION_SINK'
                client-ltp:
                  type: array
                  uniqueItems: true
                  minItems: 1
                  maxItems: 1
                  items:
                    type: string
                    description: 'Identifier of the client SnmpClient'
                server-ltp:
                  type: array
                  uniqueItems: true
                  minItems: 0
                  maxItems: 0
                  items:
                    type: string
                layer-protocol:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    type: object
                    required:
                      - local-id
                      - layer-protocol-name
                      - tcp-client-interface-1-0:tcp-client-interface-pac
                    properties:
                      local-id:
                        type: string
                        enum:
                          - '0'
                      layer-protocol-name:
                        type: string
                        enum:
                          - 'tcp-client-interface-1-0:LAYER_PROTOCOL_NAME_TYPE_TCP_LAYER'
                      tcp-client-interface-1-0:tcp-client-interface-pac:
                        type: object
                        required:
                          - tcp-client-interface-configuration
                        properties:
                          tcp-client-interface-configuration:
                            type: object
                            required:
                              - remote-address
                              - remote-port
                            properties:
                              remote-address:
                                type: object
                                minProperties: 1
                                maxProperties: 1
                                additionalProperties: false
                                properties:
                                  ip-address:
                                    type: object
                                    minProperties: 1
                                    additionalProperties: false
                                    properties:
                                      ipv-4-address:
                                        type: string
                                        description: >
                                          'IP address of the device
                                          from [MM://v1/provide-netconf-interface$request.body#device-ip]'
                              remote-port:
                                type: integer
                                minimum: 161
                                maximum: 161
                                description: 'Using 161 as a default is abstracting that Huawei is not using SNMP, but Qx.'
      forwarding-domain:
        type: array
        items:
          type: object
          properties:
            forwarding-construct:
              type: array
              items:
                type: object
                required:
                  - uuid
                  - name
                  - fc-port
                properties:
                  uuid:
                    type: string
                    description: >
                      'Unique identifier of the mediatorProcess composed from the Network Element ID and -med-fc-000
                      from [MM://v1/provide-netconf-interface$request.body#mount-name]-med-fc-000'
                  name:
                    type: array
                    items:
                      type: object
                      required:
                        - value-name
                        - value
                      properties:
                        value-name:
                          type: string
                          enum:
                            - 'deviceName'
                        value:
                          type: string
                          description: >
                            'Network Element ID
                            from [MM://v1/provide-netconf-interface$request.body#mount-name]'
                  fc-port:
                    type: array
                    minItems: 2
                    maxItems: 2
                    items:
                      oneOf:
                        - description: 'netconf fc port'
                          type: object
                          required:
                            - local-id
                            - port-direction
                            - logical-termination-point
                          properties:
                            local-id:
                              type: string
                              enum:
                                - '0'
                            port-direction:
                              type: string
                              enum:
                                - 'core-model-1-4:PORT_DIRECTION_TYPE_OUTPUT'
                            logical-termination-point:
                              type: string
                              description: 'Identifier of the NetconfServer'
                        - description: 'snmp fc port'
                          type: object
                          required:
                            - local-id
                            - port-direction
                            - logical-termination-point
                          properties:
                            local-id:
                              type: string
                              enum:
                                - '1'
                            port-direction:
                              type: string
                              enum:
                                - 'core-model-1-4:PORT_DIRECTION_TYPE_INPUT'
                            logical-termination-point:
                              type: string
                              description: 'Identifier of the SnmpClient'
