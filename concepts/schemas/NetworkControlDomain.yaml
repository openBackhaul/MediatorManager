core-model-1-4:network-control-domain:
  type: array
  minItems: 4
  maxItems: 4
  items:
    type: object
    required:
      - uuid
      - name
      - control-construct
      - link
    properties:
      uuid:
        type: string
        enum:
          - 'candidate'
          - 'startup'
          - 'running'
          - 'operational'
        description: 'NMDA data storage that holds the NetworkControlDomain'
      control-construct:
        type: array
        uniqueItems: true
        items:
          oneOf:
            - description: 'controller - see Controller.yaml'
              type: object
            - description: 'mediatorVm - see MediatorVm.yaml'
              type: object
            - description: 'device - see Device.yaml'
              type: object
      link:
        type: array
        uniqueItems: true
        items:
          oneOf:
            - description: 'netconfLink - see NetconfConnection.yaml'
              type: object
            - description: 'snmpLink - see SnmpConnection.yaml'
              type: object
      forwarding-domain:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          oneOf:
            - description: 'managementPlaneTransport'
              type: object
              required:
                - uuid
                - layer-protocol-name
                - forwarding-construct
              properties:
                uuid:
                  type: string
                layer-protocol-name:
                  type: string
                  enum:
                    - 'managementPlaneTransportLayer'
                forwarding-construct:
                  type: array
                  uniqueItems: true
                  items:
                    type: object
                    description: 'managementPlaneTransportFc - see ManagementPlaneTransportConnection.yaml'

