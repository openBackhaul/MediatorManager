core-model-1-4:network-control-domain:
  type: object
  properties:
    link:
      type: array
      uniqueItems: true
      items:
        oneOf:
          - description: 'snmpLink'
            type: object
            required:
              - uuid
              - name
              - layer-protocol-name
              - end-point-list
            properties:
              uuid:
                type: string
                pattern: '^(?:\d{3}(?:25|27)\d{4}|\d{3}55\d{4}[AB]-snmp-link-([0-9]{3}))$'
                description: >
                  'Unique identifier of the snmpLink composed from the Network Element ID and a sequence number that makes it unique
                  from [/core-model-1-4:control-construct/equipment-augment-1-0:control-construct-pac/external-label]-snmp-link-[sequence number]'
              name:
                type: array
                items:
                  type: object
                  required:
                    - value-name
                    - value
                  properties:
                    value-name:
                      type: string
                      enum:
                        - 'deviceName'
                    value:
                      type: string
                      description: >
                        'Network Element ID
                        from [MM://v1/provide-netconf-interface$request.body#mount-name]'
              layer-protocol-name:
                type: string
                enum:
                  - 'snmp-link-1-0:LAYER_PROTOCOL_NAME_TYPE_SNMP_LAYER'
              end-point-list:
                type: array
                minItems: 2
                maxItems: 2
                items:
                  oneOf:
                    - description: 'snmp server at device'
                      type: object
                      required:
                        - control-construct
                        - logical-termination-point
                        - layer-protocol
                      properties:
                        control-construct:
                          type: string
                          description: >
                            'UUID of the device, 
                            which is the same Network Element ID as in UUID of SnmpLink'
                        logical-termination-point:
                          type: string
                          description: >
                            'UUID of the SnmpServer
                            which is composed from the same Network Element ID as in UUID of SnmpLink and -snmp-s- and a sequence number'
                        layer-protocol:
                          type: string
                          enum:
                            - '0'
                    - description: 'snmp client at mediatorProcess'
                      type: object
                      required:
                        - control-construct
                        - logical-termination-point
                        - layer-protocol
                      properties:
                        control-construct:
                          type: string
                          description: 'UUID of the mediatorVm'
                        logical-termination-point:
                          type: string
                          description: >
                            'UUID of the SnmpClient
                            which is composed from the same Network Element ID as in UUID of SnmpLink and -snmp-c- and a sequence number'
                        layer-protocol:
                          type: string
                          enum:
                            - '0'
